---

- name: Install Wordpress
  hosts: linux
  gather_facts: true

  pre_tasks:
    - name: Update apt cache if needed
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"
  roles:
    - role: wordpress
      when: ansible_os_family == "RedHat"
    - role: mysql
      when: ansible_os_family == "Debian"
